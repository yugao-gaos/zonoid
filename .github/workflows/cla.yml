name: CLA Assistant

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# For same-repo PRs GITHUB_TOKEN has sufficient permissions.
# Cross-fork PRs: if you need to write to the signatures branch from a fork,
# you may need a PAT stored as PERSONAL_ACCESS_TOKEN — for most public repos
# GITHUB_TOKEN is enough.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'recheck'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/yugao-gaos/zonoid/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bot*,dependabot[bot]
