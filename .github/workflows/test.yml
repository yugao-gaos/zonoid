name: test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # @xenova/transformers is a huge optionalDependency and unnecessary
      # when ZONOID_SKIP_LIVE=1 (the runner sets it for every test file).
      - run: npm ci --omit=optional
      - run: npm run test:all
