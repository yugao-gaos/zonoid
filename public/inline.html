<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #e6edf3; }
  header { padding: 10px 12px; border-bottom: 1px solid #21262d; display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 13px; margin: 0; font-weight: 700; letter-spacing: 0; }
  .sum { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
  .sum span { color: #8b949e; } .sum b { color: #e6edf3; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 9px; border: 1px solid #30363d; white-space: nowrap; }
  main { padding: 12px; display: grid; gap: 12px; }
  .panel { border: 1px solid #30363d; border-radius: 7px; background: #161b22; padding: 10px; }
  .overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .metric { border: 1px solid #30363d; border-radius: 6px; padding: 8px; min-width: 0; }
  .metric .k { color: #8b949e; font-size: 10px; text-transform: uppercase; }
  .metric .v { font-size: 20px; line-height: 1.1; margin-top: 4px; font-weight: 700; }
  .metric .d { color: #8b949e; font-size: 10px; margin-top: 4px; overflow-wrap: anywhere; }
  .status-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .status { border: 1px solid #30363d; border-radius: 6px; padding: 7px 8px; min-width: 0; }
  .status .n { font-size: 16px; font-weight: 700; }
  .status .l { color: #8b949e; font-size: 10px; text-transform: uppercase; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, a.btn { appearance: none; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #e6edf3; padding: 6px 9px; font: inherit; text-decoration: none; cursor: pointer; }
  button:hover, a.btn:hover { border-color: #58a6ff; }
  .ready { color: #e3b341; } .active { color: #58a6ff; } .tested { color: #2dd4bf; }
  .done { color: #3fb950; } .failed { color: #ff7b72; } .muted { color: #8b949e; }
  .empty{color:#6e7681;padding:10px 12px} .src{color:#6e7681;font-size:10px}
  @media (max-width: 560px) {
    .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header><h1>Zonoid</h1><div class="sum" id="sum"></div><div class="src" id="src"></div></header>
<main id="dash"><div class="empty">connecting…</div></main>
<script>
  // ---- MCP Apps bridge + direct-fetch (belt and suspenders) ----
  const DAEMON = 'http://localhost:8787';
  const WS = new URLSearchParams(location.search).get('workspace') || '';
  const scoped = (path) => WS ? path + (path.includes('?') ? '&' : '?') + 'workspace=' + encodeURIComponent(WS) : path;
  let started = false, rpc = 1000, useBridge = false; const pending = {};
function postParent(msg){ try { parent.postMessage(msg, '*'); } catch(e){} }
function bridgeCall(name, args){
  return new Promise((resolve) => { const id = ++rpc; pending[id] = resolve;
    postParent({ jsonrpc:'2.0', id, method:'tools/call', params:{ name, arguments: args||{} } });
    setTimeout(() => { if(pending[id]){ delete pending[id]; resolve(null); } }, 2500); });
}
window.addEventListener('message', (e) => {
  const m = e.data; if(!m || typeof m !== 'object') return;
  if (m.id != null && pending[m.id]) { pending[m.id](m.result); delete pending[m.id]; return; }  // responses to ui/initialize + tools/call
  if (m.method === 'ui/notifications/tool-result') { refresh(); return; }                         // host pushed a tool result -> refresh
  if (m.method === 'ui/initialize') { postParent({ jsonrpc:'2.0', id:m.id, result:{} }); }        // defensive: some hosts may probe
});
// MCP Apps handshake — the VIEW (iframe) initiates it. The host keeps us hidden until we send
// ui/initialize and then ui/notifications/initialized.
function handshake(){
  const id = ++rpc;
  pending[id] = () => { postParent({ jsonrpc:'2.0', method:'ui/notifications/initialized', params:{} }); start(); };
  postParent({ jsonrpc:'2.0', id, method:'ui/initialize', params:{
    protocolVersion:'2025-06-18',
    appCapabilities:{ tools:{ listChanged:true }, availableDisplayModes:['inline','fullscreen'] },
    clientInfo:{ name:'orchestrator', version:'0.1.0' }
  } });
}
async function getState(){
  // 1) direct fetch (works if connectDomains allows localhost — proven in the preview panel)
  try { const r = await fetch(DAEMON + scoped('/state'), { cache:'no-store' }); if (r.ok) { useBridge=false; return await r.json(); } } catch(e){}
  // 2) fallback: ask the host to call our get_graph tool
  try { const out = await bridgeCall('get_graph'); const t = out && out.content && out.content[0] && out.content[0].text; if (t) { useBridge=true; return JSON.parse(t); } } catch(e){}
  return null;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusCount(sc,k){ return Number(sc&&sc[k]||0); }
function dashboardUrl(){
  return DAEMON + scoped('/graph');
}
function render(d){
  const dash=document.getElementById('dash');
  if(!d){ dash.innerHTML='<div class="empty">daemon unreachable (start a session or run the daemon)</div>'; return; }
  const s=d.summary, sc=s.statuses||{}, order=['not_ready','ready','in_progress','tested','done','failed','canceled'];
  document.getElementById('sum').innerHTML = `<span>tasks <b>${s.tasks_total}</b></span>`+
    order.filter(k=>sc[k]).map(k=>`<span class="chip s-${k}"><b>${sc[k]}</b> ${k.replace('_',' ')}</span>`).join('')+
    (s.ghosts?`<span class="chip s-ghost"><b>${s.ghosts}</b> ghost</span>`:'')+
    `<span>· agents <b>${s.agents.running}</b>▶ <b>${s.agents.done}</b>✓</span>`;
  document.getElementById('src').textContent = (useBridge?'via bridge':'via daemon') + (d.workspace?(' · '+d.workspace.split('/').pop()):'');
  const active=statusCount(sc,'in_progress');
  const ready=statusCount(sc,'ready');
  const tested=statusCount(sc,'tested');
  const blocked=statusCount(sc,'not_ready');
  const done=statusCount(sc,'done');
  const failed=statusCount(sc,'failed');
  const canceled=statusCount(sc,'canceled');
  const frontierKept=s.frontier_kept || (d.tasks&&d.tasks.length) || 0;
  const agents=s.agents||{};
  dash.innerHTML = `
    <section class="overview">
      <div class="metric"><div class="k">Ready</div><div class="v ready">${ready}</div><div class="d">available for loop dispatch</div></div>
      <div class="metric"><div class="k">Active</div><div class="v active">${active}</div><div class="d">${Number(agents.running||0)} running agent(s)</div></div>
      <div class="metric"><div class="k">Tested</div><div class="v tested">${tested}</div><div class="d">review or merge attention</div></div>
      <div class="metric"><div class="k">Frontier</div><div class="v">${frontierKept}</div><div class="d">summary nodes retained</div></div>
    </section>
    <section class="panel">
      <div class="status-grid">
        <div class="status"><div class="n muted">${blocked}</div><div class="l">not ready</div></div>
        <div class="status"><div class="n ready">${ready}</div><div class="l">ready</div></div>
        <div class="status"><div class="n active">${active}</div><div class="l">in progress</div></div>
        <div class="status"><div class="n tested">${tested}</div><div class="l">tested</div></div>
        <div class="status"><div class="n done">${done}</div><div class="l">done</div></div>
        <div class="status"><div class="n failed">${failed}</div><div class="l">failed</div></div>
        <div class="status"><div class="n muted">${canceled}</div><div class="l">canceled</div></div>
      </div>
    </section>
    <section class="actions">
      <button type="button" id="refreshBtn">Refresh</button>
      <a class="btn" target="_blank" rel="noreferrer" href="${esc(dashboardUrl())}">Open in Codex browser</a>
      <a class="btn" target="_blank" rel="noreferrer" href="${esc(dashboardUrl())}">Inspect frontier</a>
    </section>`;
  const refreshBtn=document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.onclick=refresh;
}
async function refresh(){ render(await getState()); }
function start(){ if(started)return; started=true; refresh(); setInterval(refresh, 3000);
  try { const es = new EventSource(DAEMON + scoped('/events')); es.onmessage = () => refresh(); } catch(e){} }
handshake();                 // drive the MCP Apps handshake immediately
setTimeout(start, 1000);     // fallback: standalone / preview-panel (no host responds)
</script>
</body>
</html>
