<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tool usage</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #e6edf3; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .sum span { color: #8b949e; } .sum b { color: #e6edf3; }
  a { color: #58a6ff; }
  table { border-collapse: collapse; margin: 16px; min-width: 640px; }
  th, td { text-align: left; padding: 5px 14px 5px 0; border-bottom: 1px solid #21262d; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; font-weight: 600; }
  td.n { text-align: right; padding-right: 24px; }
  .muted { color: #8b949e; } .empty { color: #6e7681; padding: 6px 16px; }
  .err { color: #ff7b72; }
  tr.never td { color: #e3b341; background: #d2992211; }
  tr.never td .tag { background: #d2992233; color: #e3b341; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
  .tag.gone { background: #f8514933; color: #ff7b72; }
</style>
</head>
<body>
<header>
  <h1>Tool usage</h1>
  <div class="sum"><span>calls</span> <b id="total">–</b> · <span>tools</span> <b id="count">–</b> · <span>never called</span> <b id="never">–</b></div>
  <a href="/graph">← graph</a>
</header>
<table>
  <thead><tr><th>tool</th><th>total</th><th>7d</th><th>errors</th><th>last called</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="note">never-called tools are highlighted — the prune candidates</div>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => {
  if (!iso) return '—';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
};
async function load() {
  const r = await fetch('/analytics/tools').then((x) => x.json()).catch(() => null);
  if (!r || !r.ok) { document.getElementById('rows').innerHTML = '<tr><td colspan="5" class="empty">daemon unreachable</td></tr>'; return; }
  document.getElementById('total').textContent = r.total_calls;
  document.getElementById('count').textContent = r.tools.length;
  document.getElementById('never').textContent = r.tools.filter((t) => t.total === 0).length;
  document.getElementById('rows').innerHTML = r.tools.map((t) =>
    `<tr class="${t.total === 0 ? 'never' : ''}"><td>${esc(t.name)}${t.registered ? '' : '<span class="tag gone">removed</span>'}</td>` +
    `<td class="n">${t.total}</td><td class="n">${t.last7d}</td>` +
    `<td class="n${t.errors ? ' err' : ''}">${t.errors}</td><td class="muted">${ago(t.last_called)}</td></tr>`
  ).join('');
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
